name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Build
        env:
          VITE_CONTENT_API_URL: https://chanray-upgraded-20261010.pages.dev/api/content
          VITE_COMMENTS_API_URL: https://chanray-upgraded-20261010.pages.dev/api/comments
          VITE_CHAT_API_URL: https://chanray-upgraded-20261010.pages.dev/api/chat
          VITE_ADMIN_SITE_URL: https://chanray-upgraded-20261010.pages.dev/admin/
          VITE_THEME_API_URL: https://chanray-upgraded-20261010.pages.dev/api/theme
        run: npm run build

      - name: Verify static output
        run: npm run test:build

      - name: Prepare Pages artifact
        run: |
          touch dist/client/.nojekyll
          cp dist/client/index.html dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
